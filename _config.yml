title: Amit Schendel
description: Security research, vulnerabilities and exploitation write-ups.
url: https://amitschendel.github.io
baseurl: ""
author: Amit Schendel
lang: en

github_username: amitschendel
twitter:
  username: amitschendel

# Matches the old theme's URLs so existing links keep working.
permalink: /:categories/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

google_analytics: G-SWNBCLV0WD

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
