title: Amit Schendel
# Left empty so GitHub Pages does not fill it from the repo description.
description: ""
url: https://amitschendel.github.io
baseurl: ""
author: Amit Schendel
lang: en

github_username: amitschendel
twitter:
  username: amitschendel

permalink: /blog/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

google_analytics: G-SWNBCLV0WD

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
